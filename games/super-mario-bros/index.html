<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Super Mario Bros - ARCADIA</title>
  <style>
    @font-face {
      font-family: "Press Start";
      src: url("Fonts/pressstart2p-webfont.woff") format("woff");
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      background: #000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #game {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 832px;
      height: 464px;
      overflow: hidden;
      transform: translate(-50%, -50%) scale(var(--arcadia-mario-scale, 1));
      transform-origin: center;
      background: #000;
    }

    #game > * {
      margin: 0 !important;
    }

    #controls {
      display: none !important;
    }

    #bootMessage,
    #fatalError {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff;
      background: #000;
      font: 12px/1.7 "Press Start", monospace;
      text-align: center;
    }

    #fatalError {
      color: #ffcf73;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <main id="viewport">
    <section id="game" aria-label="Super Mario Bros game canvas">
      <div id="bootMessage">LOADING WORLD 1-1...</div>
    </section>
    <section id="controls" aria-hidden="true"></section>
    <div id="fatalError" class="hidden" role="alert"></div>
  </main>
