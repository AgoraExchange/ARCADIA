<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>Super Mario Kart ZX - ARCADIA Port</title>
    <style>
      @-webkit-keyframes rotation {
        from {
          -webkit-transform: rotate(0deg);
        }

        to {
          -webkit-transform: rotate(360deg);
        }
      }

      @-moz-keyframes rotation {
        from {
          -moz-transform: rotate(0deg);
        }

        to {
          -moz-transform: rotate(360deg);
        }
      }

      @-o-keyframes rotation {
        from {
          -o-transform: rotate(0deg);
        }

        to {
          -o-transform: rotate(360deg);
        }
      }

      @keyframes rotation {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      html {
        background: #060612;
      }

      body {
        font-family: arial;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        min-height: fill-available;
        min-height: 100svh; /* Otherwise contents can be covered by an address bar in Safari on iOS 15 */
        min-width: 100vw;
        background: black;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        place-items: center;
      }

      body.scrollingDisabled {
        overflow: hidden;
      }

      .emscripten {
        padding-right: 0;
        display: block;
      }

      div.emscripten {
        text-align: center;
      }

      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten {
        width: height * 1.777; /* 16:9 */
        height: 100%;
        overflow: hidden;
        display: block;
        position: absolute;
        top: 0; bottom: 0; left: 0; right: 0;
        margin: auto; }

      .spinner {
        height: 30px;
        width: 30px;

        -webkit-animation: rotation 0.8s linear infinite;
        -moz-animation: rotation 0.8s linear infinite;
        -o-animation: rotation 0.8s linear infinite;
        animation: rotation 0.8s linear infinite;

        border: 5px solid #bdff00;
        border-top: 5px solid #719900;
        border-radius: 100%;
      }

      #status {
        display: inline-block;
        vertical-align: top;
        font-weight: bold;
        color: white;
      }

      #progress {
        width: 250px;
        height: 10px;
        -webkit-appearance: none;
        appearance: none;
        padding: 5px;
      }

      /* Determines the style of the background of the progress bar */
      progress[value]::-webkit-progress-bar {
        background-color: #8492a6;
        height: 10px;
        border-radius: 15px;
      }
      /* Determines the style of the completed part of the progress bar */
      progress[value]::-webkit-progress-value {
        background-image: -webkit-linear-gradient(left, #719900, #bdff00);
        height: 10px;
        border-radius: 15px;
      }

      div.loading {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }
      div.loading > * {
        padding: 10px;
        margin: 10px;
      }

      #output {
        display: none;
        height: 200px;
        background-color: black;
        color: white;
        font-family: "Lucida Console", Monaco, monospace;
        outline: none;
        border: none;
        padding: 0;
        width: 100%;
      }

      #message-container {
        display: none;
        min-height: 50px;
        background-color: rgba(20, 20, 20, 0.5);
        outline: none;
        border: none;
        padding: 0;
        width: 100%;
        position: absolute;
        top: 0;
      }

      #messages {
        margin-left: 50px;
        color: white;
        font-family: "Lucida Console", Monaco, monospace;
        outline: none;
        border: none;
        padding: 0;
      }
    </style>
  </head>

  <body>
    <canvas
      class="emscripten"
      id="canvas"
      oncontextmenu="event.preventDefault()"
      tabindex="-1"
    >
    </canvas>
    <div class="loading">
      <div class="spinner" id="spinner"></div>
      <div class="emscripten" id="status">Downloading...</div>

      <progress value="0" max="100" id="progress" hidden="1"></progress>
    </div>

    <div id="message-container">
      <div id="messages">
      </div>
    </div>

    <script type="text/javascript">
      const CHANGE_ASPECT_RATIO = true;
      const ARCADIA_MESSAGE_SOURCE = "arcadia-sm-kart-zx";
      const ARCADIA_KEYS = Object.freeze({
        up: { key: "ArrowUp", code: "ArrowUp", value: 38 },
        down: { key: "ArrowDown", code: "ArrowDown", value: 40 },
        left: { key: "ArrowLeft", code: "ArrowLeft", value: 37 },
        right: { key: "ArrowRight", code: "ArrowRight", value: 39 },
        accelerate: { key: "x", code: "KeyX", value: 88 },
        back: { key: "z", code: "KeyZ", value: 90 },
        item: { key: "s", code: "KeyS", value: 83 },
        jump: { key: "c", code: "KeyC", value: 67 },
        start: { key: "Enter", code: "Enter", value: 13 },
        lookback: { key: " ", code: "Space", value: 32 }
      });
      const arcadiaHeldKeys = new Set();
      const arcadiaAudioContexts = new Set();
      const arcadiaNativeAudioContext = window.AudioContext || window.webkitAudioContext;
      const arcadiaOriginalGetContext = HTMLCanvasElement.prototype.getContext;
      let arcadiaSawLitFrame = false;
      let arcadiaBlackSince = 0;
      let arcadiaBlackRecoveryIssued = false;
      let arcadiaRendererRecoveryAttempts = 0;
      let arcadiaRendererRecoveryInFlight = false;

      if (arcadiaNativeAudioContext) {
        const ArcadiaTrackedAudioContext = function (...options) {
          const context = Reflect.construct(arcadiaNativeAudioContext, options);
          arcadiaAudioContexts.add(context);
          context.addEventListener?.("statechange", arcadiaReportAudioState);
          return context;
        };
        ArcadiaTrackedAudioContext.prototype = arcadiaNativeAudioContext.prototype;
        try {
          Object.setPrototypeOf(ArcadiaTrackedAudioContext, arcadiaNativeAudioContext);
        } catch {}
        try {
          window.AudioContext = ArcadiaTrackedAudioContext;
        } catch {}
        try {
          window.webkitAudioContext = ArcadiaTrackedAudioContext;
        } catch {}
      }

      HTMLCanvasElement.prototype.getContext = function (type, attributes) {
        const isGameCanvas = this.id === "canvas" && typeof type === "string" && type.toLowerCase().includes("webgl");
        const nextAttributes = isGameCanvas
          ? { ...(attributes || {}), preserveDrawingBuffer: true }
          : attributes;
        return arcadiaOriginalGetContext.call(this, type, nextAttributes);
      };

      function arcadiaPost(type, detail = {}) {
        if (window.parent === window) return;
        const targetOrigin = window.location.protocol === "file:" ? "*" : window.location.origin;
        window.parent.postMessage({ source: ARCADIA_MESSAGE_SOURCE, type, ...detail }, targetOrigin);
      }

      function arcadiaGetAudioContexts() {
        const contexts = [
          ...arcadiaAudioContexts,
          window.Module?.SDL2?.Ti,
          window.Module?.SDL2?.audioContext,
          window.h?.SDL2?.Ti,
          window.h?.SDL2?.audioContext
        ];
        return contexts.filter((context, index, all) => (
          context
          && typeof context.resume === "function"
          && all.indexOf(context) === index
        ));
      }

      function arcadiaReportAudioState() {
        const contexts = arcadiaGetAudioContexts();
        const states = contexts.map((context) => String(context.state || "unknown"));
        const running = states.includes("running");
        arcadiaPost("audio", { running, contexts: contexts.length, states });
        return running;
      }

      function arcadiaUnlockAudioContext(context) {
        if (!context || context.state === "closed") return Promise.resolve(false);
        let resumeResult;
        try {
          if (context.state !== "running") resumeResult = context.resume();
          const source = context.createBufferSource();
          const gain = context.createGain();
          source.buffer = context.createBuffer(1, 1, Math.max(8_000, context.sampleRate || 22_050));
          gain.gain.value = 0;
          source.connect(gain);
          gain.connect(context.destination);
          source.start(0);
          source.onended = () => {
            try {
              source.disconnect();
              gain.disconnect();
            } catch {}
          };
        } catch {}
        return Promise.resolve(resumeResult)
          .then(() => context.state === "running")
          .catch(() => false);
      }

      window.arcadiaSMKReadProgress = function () {
        try {
          if (typeof C !== "function" || !A || typeof A.jl !== "function") return "";
          const node = C("/_savedata/smk_save")?.node;
          if (!node) return "";
          const bytes = A.jl(node);
          return bytes ? new TextDecoder().decode(bytes) : "";
        } catch {
          return "";
        }
      };

      window.arcadiaSMKRecoverRenderer = function () {
        if (arcadiaRendererRecoveryInFlight || arcadiaRendererRecoveryAttempts >= 2) return false;
        const source = document.getElementById("canvas");
        if (!source) return false;
        try {
          const context = source.getContext("webgl2") || source.getContext("webgl");
          const extension = context?.getExtension("WEBGL_lose_context");
          if (!extension) return false;
          arcadiaRendererRecoveryAttempts += 1;
          arcadiaRendererRecoveryInFlight = true;
          arcadiaPost("renderer-recovery", { attempt: arcadiaRendererRecoveryAttempts });
          ensureAspectRatio();
          window.dispatchEvent(new Event("resize"));
          extension.loseContext();
          window.setTimeout(() => {
            try {
              extension.restoreContext();
              ensureAspectRatio();
              window.dispatchEvent(new Event("resize"));
            } catch {}
            arcadiaRendererRecoveryInFlight = false;
            arcadiaBlackSince = performance.now();
          }, 220);
          return true;
        } catch {
          arcadiaRendererRecoveryInFlight = false;
          return false;
        }
      };

      function arcadiaSampleFrameHealth() {
        const source = document.getElementById("canvas");
        if (!document.body.classList.contains("game-ready") || !source?.width || !source?.height) return;
        try {
          const sample = document.createElement("canvas");
          sample.width = 48;
          sample.height = 27;
          const context = sample.getContext("2d", { willReadFrequently: true });
          context.drawImage(source, 0, 0, sample.width, sample.height);
          const pixels = context.getImageData(0, 0, sample.width, sample.height).data;
          let litPixels = 0;
          let brightness = 0;
          for (let index = 0; index < pixels.length; index += 4) {
            const total = pixels[index] + pixels[index + 1] + pixels[index + 2];
            brightness += total;
            if (total > 45) litPixels += 1;
          }
          const average = brightness / (pixels.length / 4) / 3;
          const hasVisibleFrame = litPixels >= 8 || average >= 1.5;
          if (hasVisibleFrame) {
            const recoveredAttempts = arcadiaRendererRecoveryAttempts;
            arcadiaSawLitFrame = true;
            arcadiaBlackSince = 0;
            arcadiaBlackRecoveryIssued = false;
            arcadiaRendererRecoveryInFlight = false;
            arcadiaRendererRecoveryAttempts = 0;
            if (recoveredAttempts > 0) arcadiaPost("renderer-recovered", { attempts: recoveredAttempts });
            return;
          }
          if (!arcadiaSawLitFrame || arcadiaBlackRecoveryIssued) return;
          if (!arcadiaBlackSince) arcadiaBlackSince = performance.now();
          if (arcadiaRendererRecoveryInFlight) return;
          const blackDuration = performance.now() - arcadiaBlackSince;
          if (blackDuration < 2600) return;
          if (arcadiaRendererRecoveryAttempts < 2 && window.arcadiaSMKRecoverRenderer()) return;
          if (arcadiaRendererRecoveryAttempts > 0 && blackDuration < 5200) return;
          if (arcadiaRendererRecoveryAttempts === 0 && blackDuration < 7000) return;
          arcadiaBlackRecoveryIssued = true;
          arcadiaPost("black-screen");
          if (window.parent === window) window.setTimeout(() => window.location.reload(), 120);
        } catch {
          // Cross-buffer reads can briefly fail during a normal WebGL resize; retry on the next sample.
        }
      }

      window.setInterval(arcadiaSampleFrameHealth, 700);

      function arcadiaKeyboardEvent(target, type, definition) {
        if (!target || !definition) return;
        const event = new KeyboardEvent(type, {
          key: definition.key,
          code: definition.code,
          keyCode: definition.value,
          which: definition.value,
          charCode: 0,
          bubbles: true,
          cancelable: true
        });
        for (const property of ["keyCode", "which"]) {
          if (event[property] === definition.value) continue;
          try {
            Object.defineProperty(event, property, { configurable: true, get: () => definition.value });
          } catch {}
        }
        target.dispatchEvent(event);
      }

      window.arcadiaSMKInput = function (name, pressed) {
        const definition = ARCADIA_KEYS[name];
        if (!definition) return false;
        if (pressed && arcadiaHeldKeys.has(name)) return true;
        if (!pressed && !arcadiaHeldKeys.has(name)) return true;
        pressed ? arcadiaHeldKeys.add(name) : arcadiaHeldKeys.delete(name);
        const type = pressed ? "keydown" : "keyup";
        const targets = [window, document, document.getElementById("canvas")].filter(Boolean);
        targets.forEach((target) => arcadiaKeyboardEvent(target, type, definition));
        document.getElementById("canvas")?.focus({ preventScroll: true });
        return true;
      };

      window.arcadiaSMKTap = function (name, duration = 90) {
        window.arcadiaSMKInput(name, true);
        window.setTimeout(() => window.arcadiaSMKInput(name, false), Math.max(32, duration));
      };

      window.arcadiaSMKReleaseAll = function () {
        [...arcadiaHeldKeys].forEach((name) => window.arcadiaSMKInput(name, false));
      };

      window.arcadiaSMKResumeAudio = function () {
        const contexts = arcadiaGetAudioContexts();
        const resumes = contexts.map(arcadiaUnlockAudioContext);
        return Promise.allSettled(resumes).then(() => {
          return arcadiaReportAudioState();
        });
      };

      for (const eventName of ["pointerdown", "touchstart", "mousedown", "keydown"]) {
        document.addEventListener(eventName, (event) => {
          if (event.isTrusted) window.arcadiaSMKResumeAudio();
        }, { passive: true });
      }

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin || event.source !== window.parent) return;
        const data = event.data;
        if (!data || data.source !== ARCADIA_MESSAGE_SOURCE) return;
        if (data.type === "input") window.arcadiaSMKInput(data.name, Boolean(data.pressed));
        if (data.type === "tap") window.arcadiaSMKTap(data.name, data.duration);
        if (data.type === "release-all") window.arcadiaSMKReleaseAll();
        if (data.type === "resume-audio") window.arcadiaSMKResumeAudio();
      });

      var bodyElement = document.getElementsByTagName("body")[0];
      var statusElement = document.getElementById("status");
      var progressElement = document.getElementById("progress");
      var spinnerElement = document.getElementById("spinner");
      var canvasElement = document.getElementById("canvas");

      const messageContainerElement = document.getElementById("message-container");
      const messagesElement = document.getElementById("messages");
      let rollbackMessages = [];

      let clearRollbackMessagesTimeoutId = -1;
      const showRollbackMessage = function (message) {
        let messages = "";
        rollbackMessages.push(message);
        rollbackMessages.forEach(m => messages += "<p>" + m + "</p>");

        messagesElement.innerHTML = messages;
        messageContainerElement.style.display = 'block';

        if (clearRollbackMessagesTimeoutId === -1) {
          clearTimeout(clearRollbackMessagesTimeoutId);
        }
        clearRollbackMessagesTimeoutId = setTimeout(clearRollbackMessages, 5000);
      };

      const clearRollbackMessages = function () {
        clearRollbackMessagesTimeoutId = -1;
        rollbackMessages = [];
        messageContainerElement.style.display = 'none';
      };

      var startingHeight, startingWidth;
      var startingAspect;
      var Module = {
        preRun: [],
        postRun: [],
        print: (function () {
          var element = document.getElementById("output");
          if (element) element.value = ""; // clear browser cache
          return function (text) {
            if (arguments.length > 1)
              text = Array.prototype.slice.call(arguments).join(" ");
            // These replacements are necessary if you render to raw HTML
            //text = text.replace(/&/g, "&amp;");
            //text = text.replace(/</g, "&lt;");
            //text = text.replace(/>/g, "&gt;");
            //text = text.replace('\n', '<br>', 'g');
            console.log(text);
            if (text === "Entering main loop.") {
              // It seems that this text ensures game is loaded.
              ensureAspectRatio();
              document.body.classList.add("game-ready");
              arcadiaReportAudioState();
              arcadiaPost("ready");
            }
            if (element) {
              element.value += text + "\n";
              element.scrollTop = element.scrollHeight; // focus on bottom
            }
          };
        })(),
        printErr: function (text) {
          if (arguments.length > 1)
            text = Array.prototype.slice.call(arguments).join(" ");
          console.error(text);
          if (/wasm|runner\.data|game\.unx|network|fetch|abort/i.test(String(text))) {
            arcadiaPost("error", { text: String(text) });
          }
        },
        canvas: (function () {
          var canvas = document.getElementById("canvas");

          return canvas;
        })(),
        setStatus: function (text) {
          if (!Module.setStatus.last)
            Module.setStatus.last = { time: Date.now(), text: "" };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          arcadiaPost("status", { text });
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2]) * 100;
            progressElement.max = parseInt(m[4]) * 100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;

            // If there are no status text, we are finished and can display
            // the canvas and hide the spinner
            if (!text) {
              spinnerElement.style.display = "none";
              canvasElement.style.display = "block";
            }
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function (left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(
            left
              ? "Preparing... (" +
                  (this.totalDependencies - left) +
                  "/" +
                  this.totalDependencies +
                  ")"
              : "All downloads complete."
          );
        },
      };
      Module.setStatus("Downloading...");
      window.onerror = function (event) {
        arcadiaPost("error", { text: String(event || "Unknown game error") });
        // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
        Module.setStatus("Exception thrown, see JavaScript console");
        spinnerElement.style.display = "none";
        Module.setStatus = function (text) {
          if (text) Module.printErr("[post-exception status] " + text);
        };
      };

      // Route URL GET parameters to argc+argv
      if (typeof window === "object") {
        Module['arguments'] = window.location.search.substr(1).trim().split('&');
        // If no args were passed arguments = [''], in which case kill the single empty string.
        if (!Module['arguments'][0]) {
          Module['arguments'] = [];
        }
      }

      /*
      var g_extLostContext = null;

      function toggleWebGLContext() {
        if (g_extLostContext == null) {
          var canvas = document.getElementById('canvas');
          var gl = canvas.getContext('webgl2');
          g_extLostContext = gl.getExtension('WEBGL_lose_context');
        } // end if
        var button = document.getElementById("webglbutton");
        var text = button.textContent || button.innerText;
        if (text.trim() == "Lose WebGL Context") {
          g_extLostContext.loseContext();
          button.textContent = "Restore WebGL Context";
        } // end if
        else {
          g_extLostContext.restoreContext();
          button.textContent = "Lose WebGL Context";
          g_extLostContext = null;
        } // end else
      }
      */

      var g_pWadLoadCallback = undefined;
      function setWadLoadCallback( _wadLoadCallback )
      {
        g_pWadLoadCallback = _wadLoadCallback;
      }

      var g_pAddAsyncMethod = -1;

      function setAddAsyncMethod( asyncMethod )
      {
        g_pAddAsyncMethod = asyncMethod;
      }

      var g_pJSExceptionHandler = undefined;

      function setJSExceptionHandler( exceptionHandler )
      {
        if (typeof exceptionHandler == "function") {
            g_pJSExceptionHandler = exceptionHandler;
        } // end if
      } // end setJSExceptionHandler

      function hasJSExceptionHandler()
      {
        return (g_pJSExceptionHandler != undefined) && (typeof g_pJSExceptionHandler == "function");
      } // end hasJSExceptionHandler

      function doJSExceptionHandler( exceptionJSON )
      {
        if (typeof g_pJSExceptionHandler == "function") {
          var exception = JSON.parse( exceptionJSON );
          g_pJSExceptionHandler( exception );
        } // end if
      } // end doJSExceptionHandler

      function manifestFiles()
      {
        return [ "runner.data",
"runner.js",
"runner.wasm",
"audio-worklet.js",
"game.unx" ].join( ";");
      }

      function manifestFilesMD5()
      {
        return [ "b81625fd4fbcb87b842b72fe58d23054",
"e377ab6cbc449ec110f6f2f8f6989c92",
"e3754f2da9fedc07e5c8dbde2a64e27f",
"e8f1e8db8cf996f8715a6f2164c2e44e",
"b9f27d5a69711aa55b0b366701fc856f" ];
      }

      function onFirstFrameRendered()
      {
          arcadiaPost("first-frame");
      }

      function onGameSetWindowSize(width,height)
      {
          if (startingHeight === undefined && startingWidth === undefined) {
              console.log("Initial window size set to width: " + width + ", height: " + height);

              startingHeight = height;
              startingWidth = width;
              startingAspect = startingWidth / startingHeight;
          }
      }

      function ensureAspectRatio() {
        if (canvasElement === undefined) {
          return;
        }

        if (!CHANGE_ASPECT_RATIO) {
          return;
        }

        if (startingHeight === undefined && startingWidth === undefined) {
          return;
        }

        canvasElement.classList.add("active");

        const maxWidth = window.innerWidth;
        const maxHeight = window.innerHeight;
        var newHeight, newWidth;

        // Find the limiting dimension.
        var heightQuotient = startingHeight / maxHeight;
        var widthQuotient = startingWidth / maxWidth;

        if (heightQuotient > widthQuotient) {
          // Max out on height.
          newHeight = maxHeight;
          newWidth = newHeight * startingAspect;
        } else {
          // Max out on width.
          newWidth = maxWidth;
          newHeight = newWidth / startingAspect;
        }

        canvasElement.style.height = newHeight + "px";
        canvasElement.style.width = newWidth + "px";
      }

      function enterFullscreenIfSupported() {
        if (!window.oprt || !window.oprt.enterFullscreen) { /* GX Mobile API */
          return;
        }

        window.oprt.enterFullscreen();
        let viewStatus = GM_get_view_status();
        viewStatus.fullscreen = true;
        GM_set_view_status(viewStatus);
      }

      function lockOrientationIfSupported() {
        if (!window.oprt || !window.oprt.lockPortraitOrientation || !window.oprt.lockLandscapeOrientation) { /* GX Mobile API */
          return;
        }

        let viewStatus = GM_get_view_status();
        if (viewStatus.landscape === true && viewStatus.portrait === false) {
          window.oprt.lockPortraitOrientation();
        } else if (viewStatus.landscape === false && viewStatus.portrait === true) {
          window.oprt.lockPortraitOrientation();
        }
      }

      /* Observe the dimensions of body and ensureAspectRatio of the canvas (whilst taking up maximum space)
       *
       * NOTE(robertz):
       *  We also need to request an Animation Frame to do this, if we do not, resizeObserver might throw error
       *  "ResizeObserver loop limit exceeded", which means that
       *  "[...] ResizeObserver was not able to deliver all observations within a single animation frame"
       *  https://stackoverflow.com/a/50387233 (source).
       *
       *  There are different ways to solve the issue, since the error is benign (meaning it wont crash anything)
       *  we could choose to ignore it via changing the window.onerror method, i.e
       *  ```
       *  window.onerror((event)=> {
       *    if(event==="ResizeObserver loop limit exceeded") {
       *       return
       *    }
       *     ///...rest
       *  }
       *  ```
       *  But for now we request an animationFrame which seems to be the recommended way to go about it.
       *
       * NOTE(ddrechny):
       *  window.innerWidth/Height value updates are sometimes delayed in WebKit on iOS after an orientation
       *  change. Hence we're calling ensureAspectRatio one more time after a delay to minimize the risk of
       *  sizing the canvas with outdated values.
       */
      const resizeObserver = new ResizeObserver(() => {
        window.requestAnimationFrame(ensureAspectRatio);
        setTimeout(() => window.requestAnimationFrame(ensureAspectRatio), 100);
      });
      resizeObserver.observe(document.body);

      /* NOTE(ddrechny):
       *  Body needs to be scrollable on desktop browsers for debug buttons to be accessible.
       *  On mobile browsers scrolling can be activated accidentally and debug buttons aren't useful,
       *  so it's better to disable it.
       */
      if (/Android|iPhone|iPod/i.test(navigator.userAgent)) {
        bodyElement.className = "scrollingDisabled";
        canvasElement.classList.add("animatedSizeTransitions");
        if (typeof outputContainerElement !== "undefined") outputContainerElement.hidden = true;
      }

      document.addEventListener("visibilitychange", (event) => {
        if (document.visibilityState != "visible") {
        }
      });

      window.addEventListener("load", (event) => {
        if ((!window.oprt || !window.oprt.enterFullscreen) && (!window.chrome || !window.chrome.runtime || !window.chrome.runtime.sendMessage)) {
        }
      });

      setWadLoadCallback(() => {
        enterFullscreenIfSupported();
        lockOrientationIfSupported();
      });
