<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Doodle Jump</title>
  <desc id="desc">An original green doodle creature leaping between neon ARCADIA platforms on graph paper.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset="1" stop-color="#eaf7ef"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddff79"/>
      <stop offset=".52" stop-color="#66e889"/>
      <stop offset="1" stop-color="#2fbf94"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2fad"/>
      <stop offset=".5" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#49f4ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-80%" width="220%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#4f8da1" stroke-opacity=".16" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" rx="82" fill="url(#paper)"/>
  <rect width="1024" height="1024" rx="82" fill="url(#grid)"/>
  <path d="M116 0v1024" stroke="#ff4d9f" stroke-opacity=".28" stroke-width="4"/>
  <g fill="none" stroke="#315b63" stroke-linecap="round" opacity=".2" stroke-width="9">
    <path d="M744 142l26-37 28 39m-27-39v91"/>
    <path d="M202 290c40-37 89-22 101 14-35 24-70 24-101-14Z"/>
    <circle cx="832" cy="483" r="34"/>
    <path d="M180 616l55 55m0-55-55 55"/>
  </g>
  <g filter="url(#glow)">
    <rect x="84" y="792" width="420" height="44" rx="18" fill="url(#neon)" stroke="#321341" stroke-width="8"/>
    <rect x="593" y="608" width="286" height="38" rx="16" fill="#49f4ff" stroke="#173f42" stroke-width="8"/>
    <rect x="104" y="414" width="244" height="38" rx="16" fill="#57ff9a" stroke="#173f42" stroke-width="8"/>
  </g>
  <text x="294" y="821" fill="#10051d" font-family="monospace" font-size="31" font-weight="900" text-anchor="middle">ARCADIA</text>
  <g transform="translate(356 306) rotate(-5)" stroke="#173f42" stroke-linejoin="round">
    <path d="M84 47Q161-16 252 33q60 34 41 144-17 105-115 118Q74 307 35 221-9 114 84 47Z" fill="url(#body)" stroke-width="15"/>
    <path d="M143 37q-8-51-45-70" fill="none" stroke-width="14" stroke-linecap="round"/>
    <circle cx="96" cy="-36" r="24" fill="#ff2fad" stroke-width="12"/>
    <g fill="#fff" stroke-width="11">
      <ellipse cx="176" cy="104" rx="43" ry="52"/>
      <ellipse cx="251" cy="109" rx="37" ry="47"/>
    </g>
    <g fill="#162e37" stroke="none">
      <circle cx="193" cy="115" r="14"/>
      <circle cx="266" cy="119" r="13"/>
    </g>
    <path d="M274 162q88-8 108 37-31 50-121 29Z" fill="#49f4ff" stroke-width="14"/>
    <path d="M303 184l51 9" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="9" stroke-linecap="round"/>
    <g fill="none" stroke-width="20" stroke-linecap="round">
      <path d="M110 271 81 342m111-62 38 69"/>
      <path d="M43 342h75m75 7h73" stroke="#ff2fad"/>
    </g>
  </g>
  <g font-family="monospace" font-weight="900" text-anchor="middle">
    <text x="512" y="118" fill="#243e41" font-size="78" letter-spacing="8">DOODLE</text>
    <text x="512" y="202" fill="#ff2fad" font-size="104" letter-spacing="11" stroke="#5f2356" stroke-width="3">JUMP</text>
  </g>
  <rect x="20" y="20" width="984" height="984" rx="66" fill="none" stroke="url(#neon)" stroke-width="18" opacity=".85"/>
</svg>
